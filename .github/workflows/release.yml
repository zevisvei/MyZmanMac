name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # Optional Developer ID signing + notarization: active only when these secrets exist (see README).
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC_PW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" build.keychain
          ID=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build app (universal)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build_app.sh

      - name: Check calculations
        run: |
          .build/apple/Products/Release/MyZmanMac --dump 2026-11-02 Jerusalem | tee dump.txt
          grep -q "כ״ב חשון תשפ״ז" dump.txt
          grep -q "בכורות מ״ה" dump.txt

      - name: Notarize
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd build
          ditto -c -k --keepParent MyZman.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple MyZman.app
          rm notarize.zip

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MyZman.app MyZman.zip
          mkdir -p dmg && cp -R MyZman.app dmg/ && ln -s /Applications dmg/Applications
          cp ../scripts/enable-widget.sh dmg/enable-widget.sh
          hdiutil create -volname "MyZman" -srcfolder dmg -ov -format UDZO MyZman.dmg
          shasum -a 256 MyZman.zip MyZman.dmg > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MyZman
          path: |
            build/MyZman.zip
            build/MyZman.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MyZman.zip
            build/MyZman.dmg
            build/SHA256SUMS.txt
            scripts/enable-widget.sh
          generate_release_notes: true
          body: |
            ## התקנה
            1. הורידו את `MyZman.dmg` (או `MyZman.zip`) וגררו את MyZman ל-Applications.
            2. אם macOS מזהיר ש„המפתח לא מזוהה” (גרסה שלא נחתמה בתעודת Developer ID): לחיצה ימנית על האפליקציה ← „פתח”.
               לחלופין, במסוף: `xattr -dr com.apple.quarantine /Applications/MyZman.app`
            3. האייקון יופיע בשורת התפריטים העליונה.

            ## ווידג'טים
            יש ארבעה ווידג'טים: הזמן הבא, זמני היום, תאריך עברי וזמני שבת.
            macOS מציג ווידג'טים רק של אפליקציות שחתומות בתעודת מפתח. כדי לחתום בחינם:
            1. התקינו את Xcode מה-App Store, ובתוכו Settings ← Accounts ← „+” ← התחברו עם Apple ID.
            2. בחרו בחשבון ← Manage Certificates ← „+” ← Apple Development.
            3. הריצו במסוף: `zsh enable-widget.sh` (הקובץ נמצא ב-DMG ובנכסי הגרסה).
            4. לחיצה ימנית על שולחן העבודה ← „עריכת ווידג'טים” ← חפשו „זמנים”.

            דורש macOS 14 ומעלה. ⚠︎ אין לסמוך על הזמנים להלכה למעשה – יש לבדוק מול לוח מוסמך.
