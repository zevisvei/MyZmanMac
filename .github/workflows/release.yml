name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::No signing certificate secrets – building ad-hoc (widgets won't appear). See scripts/setup-release-signing.sh"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -base64 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=MyZman Release Signing" >> "$GITHUB_ENV"

      - name: Build app (universal)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build_app.sh

      - name: Show signature
        run: codesign -dv build/MyZman.app/Contents/PlugIns/MyZmanWidget.appex 2>&1 | grep -E "Signature|Authority" || true

      - name: Check calculations
        run: |
          BIN="$(cat build/products-dir)/MyZmanMac"
          "$BIN" --dump 2026-11-02 Jerusalem | tee dump.txt
          grep -q "כ״ב חשון תשפ״ז" dump.txt
          grep -q "בכורות מ״ה" dump.txt
          # Sea-level sunrise (elevation off by default; 05:56:xx, rounded up "lechumra") and candle lighting
          # from sea-level sunset (raw --all values are truncated).
          grep -q "  נץ: 05:57" dump.txt
          "$BIN" --dump 2026-06-21 Jerusalem --all | grep -q "\[GetCandleLighting\] 19:29"
          # Eilat is on Israel time (it once had Jordan's, an hour off in winter).
          "$BIN" --dump 2026-12-21 Eilat | grep -q "  נץ: 06:31"

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MyZman.app MyZman.zip
          mkdir -p dmg && cp -R MyZman.app dmg/ && ln -s /Applications dmg/Applications
          cp ../scripts/enable-widget.sh dmg/enable-widget.sh
          hdiutil create -volname "MyZman" -srcfolder dmg -ov -format UDZO MyZman.dmg
          shasum -a 256 MyZman.zip MyZman.dmg > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MyZman
          path: |
            build/MyZman.zip
            build/MyZman.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MyZman.zip
            build/MyZman.dmg
            build/SHA256SUMS.txt
            scripts/enable-widget.sh
          generate_release_notes: true
          body: |
            ## התקנה
            1. הורידו את `MyZman.dmg` (או `MyZman.zip`) וגררו את MyZman ל-Applications.
            2. בפתיחה הראשונה macOS חוסם את האפליקציה („MyZman.app לא נפתח”), כי היא לא מאומתת אצל Apple. לוחצים „סיום”, ואז:
               - **הגדרות המערכת ← פרטיות ואבטחה ←** בחלק „אבטחה” לוחצים **„פתח בכל זאת”** ומאשרים בסיסמה,
               - או במסוף: `xattr -d com.apple.quarantine /Applications/MyZman.app` (בלי ‎-r).
            3. האייקון יופיע בשורת התפריטים העליונה.

            ## ווידג'טים
            יש ארבעה ווידג'טים: הזמן הבא, זמני היום, תאריך עברי וזמני שבת.
            הגרסה חתומה בתעודה של הפרויקט, ולכן הווידג'טים עובדים מיד.
            להוספה: לחיצה ימנית על שולחן העבודה ← „עריכת ווידג'טים” ← חפשו „זמנים”.

            דורש macOS 14 ומעלה. ⚠︎ אין לסמוך על הזמנים להלכה למעשה – יש לבדוק מול לוח מוסמך.
